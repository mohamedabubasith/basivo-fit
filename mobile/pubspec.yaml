name: basivo_fit
description: "Basivo Fit (PulseFolio): your Fitbit health, beautifully clear."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  google_sign_in: 7.2.0
  shared_preferences: 2.5.6
  lucide_icons_flutter: 4.0.1
  url_launcher: 6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold.ttf
          weight: 600
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode.ttf
